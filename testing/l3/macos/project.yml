# XcodeGen 工程模板 —— 从 Package.swift 生成可跑 XCUITest 的 .xcodeproj
#
# 用法（P4）：
#   brew install xcodegen
#   cd macos && xcodegen --spec ../testing/l3/macos/project.yml
#   xcodebuild -project Rhythm.xcodeproj \
#     -scheme Rhythm -destination 'platform=macOS' test
#
# 生成产物 Rhythm.xcodeproj 应加入 .gitignore（由 spec 再生）。

name: Rhythm
options:
  bundleIdPrefix: com.rhythm
  deploymentTarget:
    macOS: "14.0"
packages:
  SwiftSnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  Rhythm:
    type: application
    platform: macOS
    sources:
      - path: Rhythm
        excludes:
          - Bridge
          - Resources
      - path: RhythmTheme    # P2：Theme.swift 拆出独立目录；Xcode 单 target 双目录，符号天然可见
    dependencies:
      - package: SwiftSnapshotTesting  # L2 快照测试依赖
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app
        SWIFT_VERSION: "5.9"
        # L3 ① 运行时外观切换：测试需能写 -g AppleInterfaceStyle
        ENABLE_APP_SANDBOX: NO
  RhythmUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../testing/l3/macos
        excludes:
          - project.yml
    dependencies:
      - target: Rhythm
    settings:
      base:
        TEST_TARGET_NAME: Rhythm
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythm.app.uitests
        SWIFT_VERSION: "5.9"
schemes:
  Rhythm:
    build:
      targets:
        Rhythm: all
    test:
      targets:
        - RhythmUITests
