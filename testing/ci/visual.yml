# L2/L3 视觉与 UI 自动化（PR label "visual-review" 或 main push）
#
# 部署：拷到 .github/workflows/visual.yml 使用。
# macOS 矩阵 [13, 14, 15] × [arm64, x86_64]（macos-13/14/15 + 架构 runner）；
# Windows 在 windows-latest 上跑 golden + WinAppDriver（或降级路径）。

name: visual

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: "17 2 * * *"

jobs:
  macos-snapshots:
    name: macOS 快照（${{ matrix.os }} / ${{ matrix.arch }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: arm64
          - os: macos-14
            arch: arm64
          - os: macos-15
            arch: arm64
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: x86_64
          - os: macos-15
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: 生成 XcodeGen 工程
        run: |
          brew install xcodegen
          cd macos && xcodegen --spec ../testing/l3/macos/project.yml
      - name: 快照测试（L2）
        run: |
          cd macos
          mkdir -p ../testing/logs
          xcodebuild test -project Rhythm.xcodeproj \
            -scheme Rhythm -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -only-testing:RhythmSnapshotTests \
            -resultBundlePath ../testing/logs/snapshots-${{ matrix.os }}-${{ matrix.arch }}.xcresult \
            2>&1 | tee ../testing/logs/snapshots-${{ matrix.os }}-${{ matrix.arch }}.log
      - name: 快照 diff 贴图
        if: failure()
        run: |
          # 对比失败时把 golden 与实际图作为 PR comment（gh pr comment --body-file）
          python3 testing/l2/windows/compare_screenshots.py \
            --actual build/snapshots --golden testing/l2/macos/golden || true
      - name: 上传测试日志（xcresult 含截图/失败 diff）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}-${{ matrix.arch }}
          path: testing/logs
          # 显式排除脚本文件（上传路径本就是纯日志目录，此为防手滑保险）
          exclude: |
            **/*.py
            **/*.sh
            **/*.ps1

  macos-ui:
    name: macOS UI 自动化（L3）
    runs-on: macos-14
    needs: macos-snapshots
    steps:
      - uses: actions/checkout@v4
      - run: cd macos && xcodegen --spec ../testing/l3/macos/project.yml
      - name: XCUITest
        run: |
          cd macos
          mkdir -p ../testing/logs
          xcodebuild test -project Rhythm.xcodeproj \
            -scheme Rhythm -destination 'platform=macOS' \
            -only-testing:RhythmUITests \
            -resultBundlePath ../testing/logs/ui-tests.xcresult \
            2>&1 | tee ../testing/logs/ui-tests.log
      - name: 上传测试日志（xcresult 含录屏/截图）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-logs
          path: testing/logs
          exclude: |
            **/*.py
            **/*.sh
            **/*.ps1

  windows-visual:
    name: Windows 视觉（L2/L3）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建截屏宿主
        run: |
          cmake -S testing/l2/windows -B build-capture
          cmake --build build-capture
      - name: 渲染 5 视图 × 2 主题
        run: build-capture/Release/capture_views.exe build/artifacts
      - name: golden 像素比对
        run: python3 testing/l2/windows/compare_screenshots.py --actual build/artifacts --golden testing/l2/windows/golden
      - name: WinAppDriver 冒烟（失败进入降级，见 l3/windows/winappdriver.md）
        run: |
          python3 testing/l3/windows/theme_switch.py --smoke --app build/Release/Rhythm.exe || true
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-visual-logs
          path: testing/logs
          exclude: |
            **/*.py
            **/*.sh
            **/*.ps1

  nightly:
    name: Nightly 基线刷新
    runs-on: macos-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: 全矩阵刷新 golden
        run: |
          # 用最新系统版本重跑快照并提交更新后的 golden（OS 升级导致的
          # NSColor 行为漂移即在此捕获）
          echo "TODO(P5): 快照 --record 后提交 golden 变更"
