# L0 + L1 静态/单元测试（每次 push/PR）
#
# 部署：拷到 .github/workflows/ci.yml 使用。
# 每个作业调用的都是本地同名命令（python3 scripts/tasks.py ...），
# 不再按平台复述一遍步骤——本地跑绿而 CI 跑红这类差异因此少一层来源（#221）。

name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    name: macOS 全量测试（L0 + L1）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: 全量测试
        # 严格模式（#144）：任一步红即非零退出，容错需显式豁免
        run: python3 scripts/tasks.py test
      - name: 上传测试日志（统一落在 testing/logs/）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-logs
          path: testing/logs
          # 显式排除脚本文件（上传路径本就是纯日志目录，此为防手滑保险）
          exclude: |
            **/*.py

  rust-core:
    name: Rust 核心
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo test -p rhythm-core

  windows:
    name: Windows 测试（L1 + L2）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 全量测试
        run: python3 scripts/tasks.py test
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: testing/logs
          exclude: |
            **/*.py
