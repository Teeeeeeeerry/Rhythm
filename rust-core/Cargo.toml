[package]
name = "rhythm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Shared core library for Rhythm music player — metadata, audio playback, library management"

[lib]
name = "rhythm_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Audio decoding & metadata
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "alac", "pcm", "isomp4"] }
symphonia-format-isomp4 = "0.5"
lofty = "0.22"

# Audio output
cpal = "0.15"

# Database
rusqlite = { version = "0.32", features = ["bundled", "vtab", "column_decltype"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# URL handling
url = "2"
regex = "1"

# Async runtime (for network streaming & yt-dlp process management)
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "time"] }

# HTTP client for streaming
reqwest = { version = "0.12", features = ["stream", "blocking", "native-tls-vendored"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "2"

# File hashing for duplicate detection
blake3 = "1"

# Verifying downloaded yt-dlp releases against their published SHA-256 sums
sha2 = "0.10"

# Random for shuffle
rand = "0.8"

# UUID for IDs if needed
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "vorbis", "wav", "alac", "pcm", "isomp4"] }
